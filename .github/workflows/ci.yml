name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # keyring's Secret Service backend (agent) links libdbus; the panel's window needs xkbcommon, Wayland and GL headers.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Agent and shared crate: must work on all three desktop OSes.
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      # `codegen` includes the check that the generated contract files (SH-9) are current.
      - run: cargo test -p secretary-shared -p secretary-agent -p secretary-panel --features secretary-shared/codegen

  # Python packages (orm, warehouse): Linux, against a real Postgres. The RLS
  # tests run as an app login role, never as superuser.
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secretary
          POSTGRES_PASSWORD: secretary
          POSTGRES_DB: secretary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secretary -d secretary"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://secretary:secretary@localhost:5432/secretary
      ORM_TEST_DATABASE_URL: postgresql://secretary:secretary@localhost:5432/secretary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ./orm -e "./warehouse[test]" -e "./overview/api[test]"
      - run: python -m pytest -q orm/tests
      - run: python -m pytest -q warehouse/tests
      - run: python -m pytest -q overview/api/tests

  # Dashboard web app (OV-1): types, unit tests, production build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secretary/overview-web typecheck
      - run: pnpm --filter @secretary/overview-web test
      - run: pnpm --filter @secretary/overview-web build

  # WH-1R acceptance: the warehouse image builds, migrates and becomes ready in Docker Compose.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait warehouse keycloak overview
      - run: curl -fsS http://localhost:8080/readyz
      - run: curl -fsS http://localhost:8090/readyz
      # WH-4: the agent's Keycloak device login works and tokens carry what the warehouse checks.
      - run: python3 deploy/keycloak/smoke_device_flow.py
      - if: failure()
        run: docker compose logs
