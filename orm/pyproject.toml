[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secretary-orm"
version = "0.1.0"
description = "Declarative PostgreSQL ORM for a single database (extracted from J-ERP)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]
