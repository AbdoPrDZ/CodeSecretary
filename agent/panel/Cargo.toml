[package]
name = "secretary-panel"
description = "CodeSecretary desktop widget + tray icon; starts the agent daemon in the background"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The program users start: it launches the daemon (`secretary-agent run`) as a
# separate background process, then shows the widget and the tray icon.
[[bin]]
name = "codesecretary"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
directories.workspace = true
eframe.workspace = true
secretary-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
webbrowser.workspace = true

# Tray icon: Windows and macOS use the native APIs; Linux uses GTK +
# AppIndicator (libgtk-3-dev, libayatana-appindicator3-dev to build).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
