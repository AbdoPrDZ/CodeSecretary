# Local development stack. Dev-only credentials — never reuse them elsewhere.
#
#   docker compose up -d --build
#   curl http://localhost:8080/readyz
#   Keycloak: http://localhost:8180 (admin console: admin / admin; realm "secretary",
#             test user dev@example.test / dev). See deploy/keycloak/README.md.
#
# Engine and overview services are added by their M0 tasks. S3-compatible
# object storage for the raw archive is added with WH-6 (MinIO no longer
# publishes free container images; pick a replacement then).

name: secretary

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secretary            # table owner; runs migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretary}
      POSTGRES_DB: secretary
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretary -d secretary"]
      interval: 5s
      timeout: 3s
      retries: 20

  warehouse:
    build:
      context: .
      dockerfile: warehouse/Dockerfile
    environment:
      DATABASE_URL: postgres://secretary_warehouse:${WAREHOUSE_DB_PASSWORD:-warehouse}@postgres:5432/secretary
      DATABASE_MIGRATION_URL: postgres://secretary:${POSTGRES_PASSWORD:-secretary}@postgres:5432/secretary
      WAREHOUSE_BIND: 0.0.0.0:8080
      LOG_FORMAT: json
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Identity provider (D14). Dev mode: HTTP, realm imported from
  # deploy/keycloak/import on first start (skipped once the realm exists).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Issuer seen by browsers and the agent; services inside Compose reach
      # Keycloak at http://keycloak:8080 (backchannel) with the same issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; ask the management port with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
