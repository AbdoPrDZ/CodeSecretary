[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secretary-warehouse"
version = "0.1.0"
description = "CodeSecretary warehouse: device API, ingest and the database schema"
requires-python = ">=3.13"
dependencies = [
  "secretary-orm",            # ../orm (installed from the repo, see README)
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "pyjwt[crypto]==2.10.1",    # Keycloak access tokens (RS256 + JWKS)
  "jsonschema==4.25.1",       # generated contract schemas (SH-9)
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "httpx==0.28.1",
]

[project.scripts]
secretary-warehouse = "secretary_warehouse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secretary_warehouse.schema" = ["sql/*.sql"]
"secretary_warehouse.contract" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
